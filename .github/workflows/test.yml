# Automated check of the built apps: the desktop app on a virtual screen, the Android app in an emulator.
name: Test Bob apps
on:
  push:
    branches: [main]
    paths: ["test.txt"]
  workflow_dispatch: {}
permissions: { contents: write }
env: { MODEL_URL: "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip" }
jobs:
  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: AbhiramUpadrashta/Bob-src, ssh-key: "${{ secrets.SRC_KEY }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund && ./build.sh && cp -R dist/web desktop/app
      - run: |
          curl -fL --retry 4 -o model.zip "$MODEL_URL"
          python3 -c "import zipfile,tarfile,os;zipfile.ZipFile('model.zip').extractall('m');d=os.listdir('m')[0];os.makedirs('desktop/model',exist_ok=True);t=tarfile.open('desktop/model/model.tar.gz','w:gz');t.add(os.path.join('m',d),arcname=d);t.close()"
      - run: cd desktop && npm install --no-audit --no-fund
      - name: Run Bob on a virtual screen
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          mkdir -p shots
          cd desktop && BOB_TEST=$PWD/../shots timeout 120 xvfb-run -a -s "-screen 0 1280x900x24" npx electron . --no-sandbox 2>&1 | tee ../shots/log.txt || true
      - uses: actions/upload-artifact@v4
        with: { name: desktop-test, path: shots }
  android-emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Get the APK
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download -R ${{ github.repository }} -p Bob.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p shots
            adb install -r Bob.apk
            adb shell pm grant com.bubblesaro.bob android.permission.RECORD_AUDIO
            adb shell pm grant com.bubblesaro.bob android.permission.READ_CONTACTS
            adb logcat -c
            adb shell am start -n com.bubblesaro.bob/.MainActivity
            sleep 25
            adb exec-out screencap -p > shots/1-open.png
            adb shell am start -a android.intent.action.ASSIST -n com.bubblesaro.bob/.MainActivity
            sleep 12
            adb exec-out screencap -p > shots/2-wake.png
            sleep 10
            adb exec-out screencap -p > shots/3-later.png
            adb logcat -d -v brief > shots/logcat.txt
            grep -iE "chromium|bob|vosk|AndroidRuntime|FATAL" shots/logcat.txt | tail -200 > shots/log-bob.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-test, path: shots }
  results:
    needs: [desktop-linux, android-emulator]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: results }
      - name: Save results to the test-results branch
        run: |
          cd results && git init -q -b test-results && git add -A
          git -c user.name=bob-tests -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "Test results ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" test-results
