# Publishes Bob's website and web app (built from the private code) to https://abhiramupadrashta.github.io/Bob/
name: Publish website
on:
  push:
    branches: [main]
    paths: ["publish.txt"]
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: AbhiramUpadrashta/Bob-src, ssh-key: "${{ secrets.SRC_KEY }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund && ./build.sh
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist/web }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
